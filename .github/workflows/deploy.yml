name: Docs CI/CD

# The public site is a pure function of two branches: main builds to the
# site root, and — while a staging branch exists — staging builds under
# /staging/. The redbrain release-export workflow pushes rc releases to
# staging and full releases to main (deleting staging), so:
#   rc release published   -> /staging/ updates, root untouched
#   full release published -> root updates, /staging/ disappears
# Pull requests build only (downloadable dist artifact), never deploy.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          path: site-main

      # Hide the reference section while it carries a hand-run pre-release
      # seed; release-labeled content (mirrored at a published tag) passes
      # through untouched.
      - name: Gate an unreleased reference seed (main)
        working-directory: site-main
        run: |
          if grep -lq "at pre-release" src/content/docs/reference/nxs-*.md 2>/dev/null; then
            find src/content/docs/reference -name '*.md' ! -name 'index.md' -delete
            echo "reference seed is pre-release - hidden from the site root"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site-main/package-lock.json

      # The reference and guide pages carry D2 diagram fences; astro-d2
      # renders them with the D2 binary at build time.
      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sudo sh -s -- --version v0.7.1

      - name: Build the root site
        id: build
        working-directory: site-main
        run: |
          npm ci
          npm run build

      - name: Check for a staging branch
        if: github.event_name != 'pull_request'
        id: staging
        run: |
          if git ls-remote --exit-code --heads \
              "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" \
              staging > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout staging
        if: steps.staging.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          path: site-staging

      - name: Gate an unreleased reference seed (staging)
        if: steps.staging.outputs.exists == 'true'
        working-directory: site-staging
        run: |
          if grep -lq "at pre-release" src/content/docs/reference/nxs-*.md 2>/dev/null; then
            find src/content/docs/reference -name '*.md' ! -name 'index.md' -delete
            echo "reference seed is pre-release - hidden from staging"
          fi

      - name: Build the staging site under /staging/
        if: steps.staging.outputs.exists == 'true'
        working-directory: site-staging
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/staging
        run: |
          npm ci
          npm run build
          mkdir -p ../site-main/dist/staging
          cp -R dist/. ../site-main/dist/staging/

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-main/dist

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-dist
          path: site-main/dist
          if-no-files-found: error

      - name: Comment PR build status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- redbrain-docs-preview-status -->';
            const status = '${{ steps.build.outcome }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const emoji = status === 'success' ? '✅' : '❌';
            const body = `${marker}\n${emoji} Docs preview build **${status}**.\n\nWorkflow run: ${runUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
